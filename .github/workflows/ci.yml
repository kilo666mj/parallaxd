name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # Stable display name for the branch-protection required check. Keep this
    # value fixed even if steps change, or required-check references break.
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      - name: Vet
        run: go vet ./...
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi
      - name: Check go.mod is tidy
        # A stale require or missing sum breaks reproducible builds and hides
        # dependency changes from review.
        run: |
          go mod tidy
          if [ -n "$(git status --porcelain -- go.mod go.sum)" ]; then
            echo "go.mod/go.sum are not tidy; run 'go mod tidy':"
            git status --porcelain -- go.mod go.sum
            git diff -- go.mod
            exit 1
          fi
      - name: Test
        run: go test -race ./...
      - name: Test selective deployment versions
        run: ansible/scripts/test-component-version.sh
      - name: Test operational assurance
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

  # parallaxd is a coordinator plus a prober agent, so a green test run is not
  # enough — everything also has to still compile on the deploy Go version.
  #
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build ./...

  # On a vX.Y.Z tag, publish all static Linux binaries and checksums as a
  # GitHub Release. The release waits for the same tests and build used by
  # branch protection, so a tag cannot bypass the normal verification path.
  release:
    needs: [test, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build static binaries
        env:
          VERSION: ${{ github.ref_name }}
          CGO_ENABLED: "0"
          GOOS: linux
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            for command in parallaxd parallaxd-probe parallaxd-watch parallaxd-ha parallaxd-network parallaxd-healthcheck parallaxd-status; do
              GOARCH=$arch go build -trimpath \
                -ldflags "-s -w -X main.version=${VERSION}" \
                -o "dist/${command}-linux-${arch}" "./cmd/${command}"
            done
          done
          (cd dist && sha256sum parallaxd-* > SHA256SUMS)
      - name: Publish release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          generate_release_notes: true
          files: |
            dist/parallaxd-linux-amd64
            dist/parallaxd-linux-arm64
            dist/parallaxd-probe-linux-amd64
            dist/parallaxd-probe-linux-arm64
            dist/parallaxd-watch-linux-amd64
            dist/parallaxd-watch-linux-arm64
            dist/parallaxd-ha-linux-amd64
            dist/parallaxd-ha-linux-arm64
            dist/parallaxd-network-linux-amd64
            dist/parallaxd-network-linux-arm64
            dist/parallaxd-healthcheck-linux-amd64
            dist/parallaxd-healthcheck-linux-arm64
            dist/parallaxd-status-linux-amd64
            dist/parallaxd-status-linux-arm64
            dist/SHA256SUMS
