name: documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out pinned documentation validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kilo666mj/michaelspost-docs
          ref: b1a8db86270bdea18d30cfd9238ff1a9be9d352c
          path: .documentation-tooling
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: Validate repository documentation
        working-directory: .documentation-tooling
        run: python -m scripts.check_source_docs "$GITHUB_WORKSPACE"
