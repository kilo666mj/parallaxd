---
# Deploying parallaxd has an ordering problem worth naming: the coordinator's
# config lists every prober's public key, and each prober's config names the
# coordinator's. Neither can be written before both keypairs exist.
#
# So the play runs in three passes rather than one:
#
#   1. generate keys everywhere, and read the public halves back
#   2. install probers, whose config needs only the coordinator's public key
#   3. install the coordinator, whose config needs every prober's
#
# Prober keys are generated on their hosts and never leave them. A standby is
# the deliberate exception for the coordinator identity: it must sign as the
# same coordinator after promotion, so the primary key is copied only to the
# standby through Ansible's protected, no-log secret path.

- name: Install binaries and generate keypairs
  hosts: parallaxd
  become: true
  gather_facts: true
  tasks:
    - name: Install firewalld
      ansible.builtin.package:
        name: firewalld
        state: present
      when: parallaxd_manage_firewalld

    - name: Enable and start firewalld
      ansible.builtin.systemd:
        name: firewalld
        enabled: true
        state: started
      when: parallaxd_manage_firewalld

    - name: Create the service account
      ansible.builtin.user:
        name: "{{ parallaxd_user }}"
        system: true
        shell: /usr/sbin/nologin
        home: "{{ parallaxd_config_dir }}"
        create_home: false

    - name: Create configuration directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: "{{ parallaxd_group }}"
        # 0750: the service reads its config, nobody else needs to.
        mode: "0750"
      loop:
        - "{{ parallaxd_config_dir }}"
        - "{{ parallaxd_key_dir }}"

    - name: Resolve the target architecture
      ansible.builtin.set_fact:
        parallaxd_goarch: >-
          {{ {'x86_64': 'amd64', 'aarch64': 'arm64', 'arm64': 'arm64',
              'armv7l': 'arm', 'armv6l': 'arm'}.get(
              ansible_facts['architecture'], ansible_facts['architecture']) }}

    - name: Resolve the distinct build architectures
      ansible.builtin.set_fact:
        parallaxd_build_architectures: >-
          {{ groups['parallaxd']
             | map('extract', hostvars, 'parallaxd_goarch')
             | unique | list }}
      run_once: true

    - name: Resolve each component source version
      ansible.builtin.command:
        cmd: "{{ playbook_dir }}/scripts/component-version.sh {{ item }}"
        chdir: "{{ playbook_dir }}/.."
      loop:
        - parallaxd
        - parallaxd-probe
        - parallaxd-watch
      loop_control:
        label: "{{ item }}"
      delegate_to: localhost
      become: false
      changed_when: false
      run_once: true
      check_mode: false
      register: parallaxd_component_versions

    # Build each component/architecture pair once. Component-specific versions
    # and -buildvcs=false make an unaffected binary byte-for-byte stable across
    # unrelated repository commits, so copy's checksum comparison only schedules
    # restarts for services whose transitive project sources actually changed.
    - name: Build each binary and architecture once locally
      ansible.builtin.command:
        cmd: >-
          go build -buildvcs=false -trimpath
          -ldflags "-s -w -X main.version={{
            (parallaxd_component_versions.results
             | selectattr('item', 'equalto', item.0)
             | map(attribute='stdout') | first | trim) }}"
          -o {{ playbook_dir }}/../parallaxd-{{ item.0 }}-linux-{{ item.1 }}
          ./cmd/{{ item.0 }}
        chdir: "{{ playbook_dir }}/.."
      environment:
        CGO_ENABLED: "0"
        GOOS: linux
        GOARCH: "{{ item.1 }}"
      loop: >-
        {{ ['parallaxd', 'parallaxd-probe', 'parallaxd-watch']
           | product(parallaxd_build_architectures) | list }}
      loop_control:
        label: "{{ item.0 }} / linux-{{ item.1 }}"
      delegate_to: localhost
      become: false
      # Compiling the local staging artifacts is preparatory work. The remote
      # copy tasks below report whether deployment state actually changed.
      changed_when: false
      run_once: true
      # Runs in check mode too: it is a local compile with no effect on any
      # host, and skipping it makes --check fail at the copy tasks with a
      # missing-file error rather than telling you what would change. A dry
      # run that cannot complete is not a dry run.
      check_mode: false

    - name: Install the coordinator binary
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../parallaxd-parallaxd-linux-{{ parallaxd_goarch }}"
        dest: /usr/local/bin/parallaxd
        mode: "0755"
      when: inventory_hostname in parallaxd_coordinator_nodes
      register: parallaxd_coordinator_binary_install

    - name: Install the prober binary
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../parallaxd-parallaxd-probe-linux-{{ parallaxd_goarch }}"
        dest: /usr/local/bin/parallaxd-probe
        mode: "0755"
      when: inventory_hostname in groups['parallaxd_probers']
      register: parallaxd_prober_binary_install

    - name: Install the watcher binary
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../parallaxd-parallaxd-watch-linux-{{ parallaxd_goarch }}"
        dest: /usr/local/bin/parallaxd-watch
        mode: "0755"
      when: inventory_hostname in groups['parallaxd_watch'] | default([])
      register: parallaxd_watcher_binary_install

    - name: Check whether a keypair already exists
      ansible.builtin.stat:
        path: "{{ parallaxd_key_dir }}/private"
      register: parallaxd_existing_key

    # Generated once and never regenerated. Rotating a key silently would
    # orphan the public half held by the other side, and the failure mode is a
    # prober whose results stop verifying — which reads as a silent prober,
    # not as a key problem.
    # The watcher verifies coordinator heartbeats using the coordinator public
    # key, but signs nothing itself. A watch-only host therefore gets no keypair.
    # Resolved into a fact rather than inline, because a multi-line Jinja
    # conditional inside a YAML folded scalar (>-) is not folded: a
    # more-indented continuation line keeps its newline, and the command
    # arrives at bash split across two lines. That produced a syntax error
    # on every host on the first attempt.
    - name: Resolve which binary mints this host's key
      ansible.builtin.set_fact:
        parallaxd_genkey_bin: >-
          {{ '/usr/local/bin/parallaxd'
             if inventory_hostname in groups['parallaxd_coordinator']
             else '/usr/local/bin/parallaxd-probe' }}

    - name: Generate a keypair
      when:
        - not parallaxd_existing_key.stat.exists
        - inventory_hostname in groups['parallaxd_coordinator'] + groups['parallaxd_probers']
      # The private key is on stdout. Without this, any failure of this task
      # prints it into the Ansible log — which is exactly what happened the
      # first time, leaking five private keys into a file on the control
      # machine. The whole point of generating on the host is that the key
      # never travels; logging it undoes that.
      no_log: true
      ansible.builtin.shell:
        cmd: "set -o pipefail; {{ parallaxd_genkey_bin }} -genkey | grep -v '^#' | grep -v '^$' > {{ parallaxd_key_dir }}/keypair.tmp"
        executable: /bin/bash
        creates: "{{ parallaxd_key_dir }}/private"

    - name: Split the keypair
      when:
        - not parallaxd_existing_key.stat.exists
        - inventory_hostname in groups['parallaxd_coordinator'] + groups['parallaxd_probers']
      # Same reasoning: these touch key material, so a failure must not print it.
      no_log: true
      block:
        - name: Write the private half
          ansible.builtin.shell:
            cmd: >-
              set -o pipefail;
              head -1 {{ parallaxd_key_dir }}/keypair.tmp > {{ parallaxd_key_dir }}/private
            executable: /bin/bash
          changed_when: true

        - name: Write the public half
          ansible.builtin.shell:
            cmd: >-
              set -o pipefail;
              tail -1 {{ parallaxd_key_dir }}/keypair.tmp > {{ parallaxd_key_dir }}/public
            executable: /bin/bash
          changed_when: true

        - name: Remove the combined file
          ansible.builtin.file:
            path: "{{ parallaxd_key_dir }}/keypair.tmp"
            state: absent

    - name: Secure the private key
      when: inventory_hostname in groups['parallaxd_coordinator'] + groups['parallaxd_probers']
      ansible.builtin.file:
        path: "{{ parallaxd_key_dir }}/private"
        owner: "{{ parallaxd_user }}"
        group: "{{ parallaxd_group }}"
        mode: "0400"

    - name: Secure the public key
      when: inventory_hostname in groups['parallaxd_coordinator'] + groups['parallaxd_probers']
      ansible.builtin.file:
        path: "{{ parallaxd_key_dir }}/public"
        owner: root
        group: "{{ parallaxd_group }}"
        mode: "0444"

    # Read back so the other side's config can be written. Only the public half
    # is ever fetched; the private half stays on the host that made it.
    - name: Read the public key
      when: inventory_hostname in groups['parallaxd_coordinator'] + groups['parallaxd_probers']
      ansible.builtin.slurp:
        src: "{{ parallaxd_key_dir }}/public"
      register: parallaxd_public_key_raw

    - name: Record the public key
      when: inventory_hostname in groups['parallaxd_coordinator'] + groups['parallaxd_probers']
      ansible.builtin.set_fact:
        parallaxd_public_key: "{{ parallaxd_public_key_raw.content | b64decode | trim }}"

# ---------------------------------------------------------------------------

- name: Configure the watcher
  hosts: parallaxd_watch
  become: true
  tasks:
    - name: Read the coordinator public key for the watcher
      ansible.builtin.slurp:
        src: "{{ parallaxd_key_dir }}/public"
      delegate_to: "{{ groups['parallaxd_coordinator'][0] }}"
      register: parallaxd_watch_coordinator_key_raw

    - name: Record the coordinator public key for the watcher
      ansible.builtin.set_fact:
        parallaxd_coordinator_public_key_runtime: >-
          {{ parallaxd_watch_coordinator_key_raw.content | b64decode | trim }}

    - name: Fail when the watcher shares a host with the coordinator
      ansible.builtin.assert:
        that: inventory_hostname not in groups['parallaxd_coordinator']
        fail_msg: >-
          The watcher is on the same host as the coordinator, so it would die
          with the thing it is watching. Put it on a different host, and
          preferably a different provider.

    - name: Deploy the watcher configuration
      ansible.builtin.template:
        src: watch.json.j2
        dest: "{{ parallaxd_config_dir }}/watch.json"
        owner: root
        group: "{{ parallaxd_group }}"
        mode: "0640"
      notify: Restart watcher

    - name: Deploy the watcher unit
      ansible.builtin.template:
        src: parallaxd-watch.service.j2
        dest: /etc/systemd/system/parallaxd-watch.service
        mode: "0644"
      notify: Restart watcher

    # Binary installation happens in the key-generation play, before this
    # service's configuration can be rendered. Delay its restart notification
    # until now so a new binary never starts against an old, incompatible
    # config between plays.
    - name: Schedule watcher restart after binary update
      ansible.builtin.debug:
        msg: Watcher binary changed; restart after configuration is complete.
      changed_when: parallaxd_watcher_binary_install.changed | default(false)
      notify: Restart watcher

    - name: Allow the coordinator to reach the watcher
      ansible.posix.firewalld:
        rich_rule: >-
          rule family="ipv4"
          source address="{{ hostvars[groups['parallaxd_coordinator'][0]]['parallaxd_address'] }}"
          port port="{{ parallaxd_watch_port }}" protocol="tcp"
          accept
        zone: public
        permanent: true
        immediate: true
        state: enabled

    - name: Enable and start the watcher
      ansible.builtin.systemd:
        name: parallaxd-watch
        enabled: true
        state: started
        daemon_reload: true

  handlers:
    - name: Restart watcher
      ansible.builtin.systemd:
        name: parallaxd-watch
        state: restarted
        daemon_reload: true

# ---------------------------------------------------------------------------

- name: Configure probers
  hosts: parallaxd_probers:!parallaxd_internal_probers
  become: true
  tasks:
    - name: Configure a public prober
      ansible.builtin.include_tasks: tasks/configure-prober.yml

  handlers:
    - name: Restart prober
      ansible.builtin.systemd:
        name: parallaxd-probe
        state: restarted
        daemon_reload: true

# ---------------------------------------------------------------------------

- name: Configure the encrypted coordinator and internal-prober network
  hosts: parallaxd_coordinator:parallaxd_standby:parallaxd_internal_probers
  become: true
  pre_tasks:
    - name: Skip HA setup when no standby is configured
      ansible.builtin.meta: end_play
      when: parallaxd_standby_hosts | length == 0
  tasks:
    - name: Require exactly one primary and one standby for HA
      ansible.builtin.assert:
        that:
          - groups['parallaxd_coordinator'] | length == 1
          - parallaxd_standby_hosts | length == 1
          - groups['parallaxd_coordinator'][0] != parallaxd_standby_hosts[0]
          - hostvars[groups['parallaxd_coordinator'][0]]['parallaxd_provider'] | default('') | length > 0
          - hostvars[parallaxd_standby_hosts[0]]['parallaxd_provider'] | default('') | length > 0
          - hostvars[groups['parallaxd_coordinator'][0]]['parallaxd_provider'] != hostvars[parallaxd_standby_hosts[0]]['parallaxd_provider']
          - parallaxd_ha_replication_token | trim | length >= 32
        fail_msg: HA requires one distinct standby, a different provider, and a 32+ character replication token.

    - name: Install WireGuard tooling
      ansible.builtin.package:
        name: wireguard-tools
        state: present

    - name: Require tunnel addresses for internal probers
      ansible.builtin.assert:
        that:
          - parallaxd_address is match('^10\\.77\\.0\\.[0-9]+$')
          - parallaxd_address not in [parallaxd_ha_primary_address, parallaxd_ha_standby_address]
          - >-
            (parallaxd_internal_prober_hosts
             | map('extract', hostvars, 'parallaxd_address') | unique | list | length)
            == (parallaxd_internal_prober_hosts | length)
        fail_msg: >-
          {{ inventory_hostname }} needs a unique IP in parallaxd_address for
          the wg-parallaxd overlay.
      when: inventory_hostname in parallaxd_internal_prober_hosts

    - name: Generate the dedicated parallaxd WireGuard keypair
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail;
          umask 077;
          wg genkey | tee {{ parallaxd_key_dir }}/ha-wg-private |
          wg pubkey > {{ parallaxd_key_dir }}/ha-wg-public
        executable: /bin/bash
        creates: "{{ parallaxd_key_dir }}/ha-wg-private"
      no_log: true

    - name: Secure the parallaxd WireGuard private key
      ansible.builtin.file:
        path: "{{ parallaxd_key_dir }}/ha-wg-private"
        owner: root
        group: root
        mode: "0400"

    - name: Read this host's parallaxd WireGuard private key
      ansible.builtin.slurp:
        src: "{{ parallaxd_key_dir }}/ha-wg-private"
      register: parallaxd_ha_wireguard_private_raw
      no_log: true

    - name: Read this host's parallaxd WireGuard public key
      ansible.builtin.slurp:
        src: "{{ parallaxd_key_dir }}/ha-wg-public"
      register: parallaxd_ha_wireguard_public_raw

    - name: Record this host's parallaxd WireGuard public key
      ansible.builtin.set_fact:
        parallaxd_ha_wireguard_public_key: >-
          {{ parallaxd_ha_wireguard_public_raw.content | b64decode | trim }}

    - name: Resolve the other coordinator
      ansible.builtin.set_fact:
        parallaxd_ha_other_coordinator: >-
          {{ groups['parallaxd_coordinator'][0]
             if inventory_hostname in parallaxd_standby_hosts
             else parallaxd_standby_hosts[0] }}
      when: inventory_hostname in parallaxd_coordinator_nodes

    - name: Validate and install the parallaxd WireGuard interface
      block:
        - name: Render the parallaxd WireGuard candidate
          ansible.builtin.template:
            src: ha-wireguard.conf.j2
            dest: "/etc/wireguard/{{ parallaxd_ha_wireguard_interface }}.conf.candidate"
            owner: root
            group: root
            mode: "0400"
          changed_when: false
          no_log: true

        - name: Validate the parallaxd WireGuard candidate
          ansible.builtin.command:
            cmd: >-
              wg-quick strip
              /etc/wireguard/{{ parallaxd_ha_wireguard_interface }}.conf.candidate
          changed_when: false
          no_log: true

        - name: Install the validated parallaxd WireGuard configuration
          ansible.builtin.copy:
            src: "/etc/wireguard/{{ parallaxd_ha_wireguard_interface }}.conf.candidate"
            dest: "/etc/wireguard/{{ parallaxd_ha_wireguard_interface }}.conf"
            remote_src: true
            owner: root
            group: root
            mode: "0400"
          no_log: true
          notify: Restart parallaxd WireGuard
      always:
        - name: Remove the parallaxd WireGuard candidate
          ansible.builtin.file:
            path: "/etc/wireguard/{{ parallaxd_ha_wireguard_interface }}.conf.candidate"
            state: absent
          changed_when: false
          no_log: true

    - name: Allow the primary to initiate the HA tunnel
      ansible.posix.firewalld:
        rich_rule: >-
          rule family="ipv4"
          source address="{{ hostvars[groups['parallaxd_coordinator'][0]]['parallaxd_address'] }}"
          port port="{{ parallaxd_ha_wireguard_port }}" protocol="udp"
          accept
        zone: public
        permanent: true
        immediate: true
        state: enabled
      when: inventory_hostname in parallaxd_standby_hosts

    # WireGuard authenticates every packet before exposing it to the host. An
    # unrestricted UDP listener is therefore safe and lets NATed internal
    # agents initiate without a brittle home-IP allowlist.
    - name: Allow internal probers to initiate encrypted tunnels
      ansible.posix.firewalld:
        port: "{{ parallaxd_ha_wireguard_port }}/udp"
        zone: public
        permanent: true
        immediate: true
        state: enabled
      when:
        - inventory_hostname in parallaxd_coordinator_nodes
        - parallaxd_internal_prober_hosts | length > 0

    - name: Enable forwarding through the primary internal-prober hub
      ansible.posix.sysctl:
        name: net.ipv4.ip_forward
        value: "1"
        state: present
        sysctl_set: true
        reload: true
      when:
        - inventory_hostname == groups['parallaxd_coordinator'][0]
        - parallaxd_internal_prober_hosts | length > 0

    - name: Enable and start the parallaxd WireGuard interface
      ansible.builtin.systemd:
        name: "wg-quick@{{ parallaxd_ha_wireguard_interface }}"
        enabled: true
        state: started
        daemon_reload: true

    - name: Apply parallaxd WireGuard changes before service configuration
      ansible.builtin.meta: flush_handlers

    - name: Trust the primary parallaxd interface for peer forwarding
      ansible.posix.firewalld:
        interface: "{{ parallaxd_ha_wireguard_interface }}"
        zone: trusted
        permanent: true
        immediate: true
        state: enabled
      when:
        - inventory_hostname == groups['parallaxd_coordinator'][0]
        - parallaxd_internal_prober_hosts | length > 0

    - name: Resolve encrypted peers that must be reachable
      ansible.builtin.set_fact:
        parallaxd_wireguard_ping_targets: >-
          {{ ([parallaxd_ha_primary_address]
              if inventory_hostname in parallaxd_standby_hosts
              else ([parallaxd_ha_standby_address]
                    if inventory_hostname in groups['parallaxd_coordinator']
                    else [parallaxd_ha_primary_address, parallaxd_ha_standby_address]))
             + ((parallaxd_internal_prober_hosts
                 | reject('equalto', inventory_hostname)
                 | map('extract', hostvars, 'parallaxd_address') | list)
                if inventory_hostname in parallaxd_internal_prober_hosts
                or inventory_hostname == groups['parallaxd_coordinator'][0]
                else []) }}

    - name: Verify encrypted peers are reachable
      ansible.builtin.command:
        cmd: "ping -c 2 -W 3 {{ item }}"
      loop: "{{ parallaxd_wireguard_ping_targets }}"
      changed_when: false
      register: parallaxd_wireguard_ping
      retries: 5
      delay: 3
      until: parallaxd_wireguard_ping.rc == 0

  handlers:
    - name: Restart parallaxd WireGuard
      ansible.builtin.systemd:
        name: "wg-quick@{{ parallaxd_ha_wireguard_interface }}"
        state: restarted
        daemon_reload: true

# The tunnel is deliberately configured before these agents start. Otherwise
# their coordinator URL points at an interface that does not exist yet and a
# successful Ansible run briefly deploys a known-unreachable monitoring node.
- name: Configure internal probers
  hosts: parallaxd_internal_probers
  become: true
  tasks:
    - name: Configure an internal prober
      ansible.builtin.include_tasks: tasks/configure-prober.yml

  handlers:
    - name: Restart prober
      ansible.builtin.systemd:
        name: parallaxd-probe
        state: restarted
        daemon_reload: true

# ---------------------------------------------------------------------------

- name: Configure the coordinator
  hosts: parallaxd_coordinator:parallaxd_standby
  become: true
  tasks:
    - name: Read prober public keys for the coordinator
      ansible.builtin.slurp:
        src: "{{ parallaxd_key_dir }}/public"
      delegate_to: "{{ item }}"
      loop: "{{ groups['parallaxd_probers'] }}"
      register: parallaxd_coordinator_prober_keys

    - name: Read the primary coordinator private key for the standby
      ansible.builtin.slurp:
        src: "{{ parallaxd_key_dir }}/private"
      delegate_to: "{{ groups['parallaxd_coordinator'][0] }}"
      register: parallaxd_primary_coordinator_private_raw
      when: inventory_hostname in parallaxd_standby_hosts
      no_log: true

    - name: Deploy the coordinator identity to the standby
      ansible.builtin.copy:
        content: "{{ parallaxd_primary_coordinator_private_raw.content | b64decode | trim }}\n"
        dest: "{{ parallaxd_key_dir }}/coordinator-private"
        owner: "{{ parallaxd_user }}"
        group: "{{ parallaxd_group }}"
        mode: "0400"
      when: inventory_hostname in parallaxd_standby_hosts
      no_log: true
      notify: Restart coordinator

    - name: Read the primary operator token for the standby
      ansible.builtin.slurp:
        src: "{{ parallaxd_key_dir }}/operator-token"
      delegate_to: "{{ groups['parallaxd_coordinator'][0] }}"
      register: parallaxd_primary_operator_token_raw
      when: inventory_hostname in parallaxd_standby_hosts
      no_log: true

    - name: Deploy the operator token to the standby
      ansible.builtin.copy:
        content: "{{ parallaxd_primary_operator_token_raw.content | b64decode | trim }}\n"
        dest: "{{ parallaxd_key_dir }}/operator-token"
        owner: "{{ parallaxd_user }}"
        group: "{{ parallaxd_group }}"
        mode: "0400"
      when: inventory_hostname in parallaxd_standby_hosts
      no_log: true
      notify: Restart coordinator

    - name: Warn when nothing is watching this coordinator
      ansible.builtin.debug:
        msg: >-
          No host is in [parallaxd_watch], so parallaxd_heartbeat_url is empty
          and nothing will notice if this coordinator dies. That silence is
          indistinguishable from everything being fine.
      when: parallaxd_heartbeat_url | trim | length == 0

    - name: Deploy the operator API token
      ansible.builtin.copy:
        content: "{{ parallaxd_operator_token | trim }}\n"
        dest: "{{ parallaxd_key_dir }}/operator-token"
        owner: "{{ parallaxd_user }}"
        group: "{{ parallaxd_group }}"
        mode: "0400"
      when: parallaxd_operator_token | trim | length > 0
      no_log: true
      notify: Restart coordinator

    - name: Deploy the bootstrap administrator password
      ansible.builtin.copy:
        content: "{{ parallaxd_bootstrap_password | trim }}\n"
        dest: "{{ parallaxd_key_dir }}/bootstrap-password"
        owner: "{{ parallaxd_user }}"
        group: "{{ parallaxd_group }}"
        mode: "0400"
      when: parallaxd_bootstrap_admin | trim | length > 0
      no_log: true
      notify: Restart coordinator

    - name: Deploy the OIDC client secret
      ansible.builtin.copy:
        content: "{{ parallaxd_oidc_client_secret | trim }}\n"
        dest: "{{ parallaxd_key_dir }}/oidc-client-secret"
        owner: "{{ parallaxd_user }}"
        group: "{{ parallaxd_group }}"
        mode: "0400"
      when: parallaxd_oidc_client_secret | trim | length > 0
      no_log: true
      notify: Restart coordinator

    - name: Deploy the HA replication token
      ansible.builtin.copy:
        content: "{{ parallaxd_ha_replication_token | trim }}\n"
        dest: "{{ parallaxd_key_dir }}/replication-token"
        owner: "{{ parallaxd_user }}"
        group: "{{ parallaxd_group }}"
        mode: "0400"
      when: parallaxd_standby_hosts | length > 0
      no_log: true
      notify: Restart coordinator

    - name: Preview coordinator configuration changes
      ansible.builtin.template:
        src: coordinator.json.j2
        dest: "{{ parallaxd_config_dir }}/coordinator.json"
        owner: root
        group: "{{ parallaxd_group }}"
        mode: "0640"
      when: ansible_check_mode
      notify: Restart coordinator

    - name: Validate and install the coordinator configuration
      when: not ansible_check_mode
      block:
        - name: Render the coordinator configuration candidate
          ansible.builtin.template:
            src: coordinator.json.j2
            dest: "{{ parallaxd_config_dir }}/coordinator.json.candidate"
            owner: root
            group: "{{ parallaxd_group }}"
            mode: "0640"
          # This file is temporary validation workspace. The atomic install
          # below owns change reporting for persistent coordinator state.
          changed_when: false

        - name: Validate the coordinator configuration candidate
          ansible.builtin.command:
            cmd: >-
              /usr/local/bin/parallaxd
              -config {{ parallaxd_config_dir }}/coordinator.json.candidate
              -validate
          changed_when: false

        # copy uses a temporary file and rename on the remote host, so readers
        # see either the old validated config or the complete new one, never a
        # partially written document.
        - name: Install the validated coordinator configuration atomically
          ansible.builtin.copy:
            src: "{{ parallaxd_config_dir }}/coordinator.json.candidate"
            dest: "{{ parallaxd_config_dir }}/coordinator.json"
            remote_src: true
            owner: root
            group: "{{ parallaxd_group }}"
            mode: "0640"
          notify: Restart coordinator
      always:
        - name: Remove the coordinator configuration candidate
          ansible.builtin.file:
            path: "{{ parallaxd_config_dir }}/coordinator.json.candidate"
            state: absent
          changed_when: false

    - name: Deploy the coordinator unit
      ansible.builtin.template:
        src: parallaxd.service.j2
        dest: /etc/systemd/system/parallaxd.service
        mode: "0644"
      notify: Restart coordinator

    - name: Schedule coordinator restart after binary update
      ansible.builtin.debug:
        msg: Coordinator binary changed; restart after configuration is complete.
      changed_when: parallaxd_coordinator_binary_install.changed | default(false)
      notify: Restart coordinator

    - name: Allow probers to reach the coordinator
      ansible.posix.firewalld:
        rich_rule: >-
          rule family="ipv4"
          source address="{{ item }}"
          port port="{{ parallaxd_coordinator_port }}" protocol="tcp"
          accept
        zone: public
        permanent: true
        immediate: true
        state: enabled
      loop: "{{ parallaxd_coordinator_allow_sources }}"

    - name: Enable and start the coordinator
      ansible.builtin.systemd:
        name: parallaxd
        enabled: true
        state: started
        daemon_reload: true

  handlers:
    - name: Restart coordinator
      ansible.builtin.systemd:
        name: parallaxd
        state: restarted
        daemon_reload: true
