---
# parallaxd tunables. Override per host in host_vars/ or inventory.

parallaxd_user: parallaxd
parallaxd_group: parallaxd
parallaxd_config_dir: /etc/parallaxd
parallaxd_key_dir: "{{ parallaxd_config_dir }}/keys"

# Ports. The control API is reachable only from the addresses in the allowlist
# below; there is no other listener.
parallaxd_coordinator_port: 8972
parallaxd_prober_port: 8973
parallaxd_watch_port: 8974

# parallaxd_address is where OTHER NODES reach this host — the service address.
# Set it per host in the inventory, and set it to an IP.
#
# Deliberately not ansible_host. That is how Ansible SSHes here, which on this
# fleet goes through a jump port and an ~/.ssh/config entry; overloading it
# would mean choosing between a working deploy and a working control plane.
# Two different questions, two variables.
#
# An IP rather than a name because DNS in the control plane is a dependency in
# the monitoring path: if resolution fails, every prober stops submitting and
# the staleness watchdog reports a fleet-wide prober failure — a confidently
# wrong diagnosis of a DNS incident. firewalld rich rules take addresses
# anyway, so a name here would need resolving somewhere regardless.
parallaxd_address: "{{ ansible_host | default(inventory_hostname) }}"

# The coordinator's address as probers reach it.
parallaxd_coordinator_host: "{{ hostvars[groups['parallaxd_coordinator'][0]]['parallaxd_address'] }}"
parallaxd_coordinator_url: "http://{{ parallaxd_coordinator_host }}:{{ parallaxd_coordinator_port }}"

# ---------------------------------------------------------------------------
# The security model
#
# Traffic is signed, not encrypted. Ed25519 both directions gives authenticity,
# integrity and replay resistance end-to-end — and unlike TLS it survives a
# proxy, because the signature covers the payload rather than the connection.
# What it does not give is confidentiality: an on-path observer sees check
# names, targets and results.
#
# The answer to that is the source allowlist rather than a tunnel. The set of
# peers is small, static and known, so restricting the port to those sources
# removes the anonymous attacker entirely, with no key material, no certificate
# lifecycle, and no new failure mode in the alerting path. A monitoring system
# that goes blind on a forgotten certificate renewal is a worse trade than one
# that leaks its check names to a transit provider.
#
# ** The allowlist must include the other PROBERS, not just the coordinator. **
# Probers connect to each other for the mesh checks. A rule permitting only the
# coordinator would break every mesh check, and — because reaching no peer is
# how isolation is defined — would silently suppress the entire fleet.
# ---------------------------------------------------------------------------

# Sources permitted to reach a prober's control port: the coordinator, plus
# every other prober. Built from the inventory so it cannot drift from it.
#
# The outer parentheses matter. In Jinja `|` binds tighter than `+`, so
# `a + b | map(...)` is `a + (b | map(...))` — which concatenated the
# coordinator group RAW with the mapped probers and handed firewalld a
# hostname. Group the concatenation before piping it.
parallaxd_prober_allow_sources: >-
  {{ ((groups['parallaxd_coordinator'] | default([]))
      + (groups['parallaxd_probers'] | default([])))
     | map('extract', hostvars, 'parallaxd_address')
     | list }}

# Sources permitted to reach the coordinator's port: every prober.
parallaxd_coordinator_allow_sources: >-
  {{ groups['parallaxd_probers'] | default([])
     | map('extract', hostvars, 'parallaxd_address')
     | list }}

# ---------------------------------------------------------------------------
# Coordinator
# ---------------------------------------------------------------------------

parallaxd_listen: "0.0.0.0:{{ parallaxd_coordinator_port }}"

# The dead-man's switch. Derived from the watcher group rather than set by
# hand: parallaxd-watch is part of this project precisely so the mechanism does
# not depend on someone else's service.
#
# The watcher must be on a DIFFERENT PROVIDER from the coordinator — not a
# different company, a different failure domain. On the same host it dies with
# what it is watching, which is the one thing it must not do.
#
# The watch is mutual without a second channel: the watcher alerts when the
# coordinator stops checking in, and the coordinator alerts (KindUnwatched)
# when it can no longer deliver here. Either dying alone is reported.
parallaxd_heartbeat_url: >-
  {{ ('http://' + hostvars[groups['parallaxd_watch'][0]]['parallaxd_address']
      + ':' + parallaxd_watch_port|string + '/v1/heartbeat')
     if (groups['parallaxd_watch'] | default([])) | length > 0 else '' }}
parallaxd_heartbeat_interval: 1m
parallaxd_heartbeat_headers: {}

# ---------------------------------------------------------------------------
# Watcher
# ---------------------------------------------------------------------------

parallaxd_watch_listen: "0.0.0.0:{{ parallaxd_watch_port }}"

# Five missed beats at the default interval. Tighter and one lost packet pages
# someone; looser and a dead coordinator goes unnoticed for longer than most
# outages last.
parallaxd_watch_grace: 5m
parallaxd_watch_check_interval: 30s

# The watcher's own alert destination. It must not depend on the coordinator
# being up — a watcher that alerted through the thing it watches would be
# silent in exactly the case it exists for. A self-hosted chat webhook is fine
# as long as it does not run on the coordinator host.
#
# Fails loudly if unset: parallaxd-watch warns at startup rather than coming up
# looking healthy.
parallaxd_watch_webhook: "{{ parallaxd_webhook }}"
parallaxd_watch_webhook_headers: "{{ parallaxd_webhook_headers }}"

# Alert destination. The log always gets the alert; this is additional, so a
# webhook that is down costs the integration and not the record.
#
# Set the real value in a gitignored group_vars/all.yml, NOT in host_vars.
# The watcher runs on a different host from the coordinator and needs it too;
# scoped to one host it silently resolves to empty on the other, and
# parallaxd-watch comes up warning that a dead coordinator would be recorded
# in its journal and nowhere else.
# The value comes from a gitignored group_vars/all.yml under a DIFFERENT name.
# Setting parallaxd_webhook itself there would lose: a named group beats the
# implicit "all" group, so this default would clobber it and the webhook would
# silently be empty everywhere.
parallaxd_webhook: "{{ parallaxd_webhook_url | default('') }}"
parallaxd_webhook_headers: {}

# Additional independently retried webhooks. Routes are optional: a
# destination with no route receives every alert. Escalations fire once for an
# active incident that remains unacknowledged past `after`.
parallaxd_notification_destinations: []
parallaxd_notification_routes: []
parallaxd_escalations: []
parallaxd_notification_retry_initial: 15s
parallaxd_notification_retry_max: 15m
parallaxd_notification_retry_interval: 5s

# Append-only observation history. Retention and per-check limits bound both
# query memory and the periodically compacted journal size.
parallaxd_history_file: /var/lib/parallaxd/observations.jsonl
parallaxd_history_retention: 720h
parallaxd_history_max_per_check: 10000

# Enables the authenticated operator API for acknowledging/resolving incidents
# and creating/cancelling silences. Define parallaxd_operator_token_secret in a
# gitignored or vaulted group_vars/all.yml. Empty keeps every mutation endpoint
# disabled. Operators can use the API locally over SSH; exposing it through the
# firewall requires deliberately adding their source address as well.
parallaxd_operator_token: "{{ parallaxd_operator_token_secret | default('') }}"

# Must exceed every corroborated check timeout. A hard-down target can consume
# its entire probe timeout before returning a down vote, and the coordinator
# still needs time to receive and verify the signed response. The coordinator
# enforces at least one second of response budget at startup; five seconds here
# leaves comfortable network and serialization headroom above the 15s checks.
parallaxd_fan_out_timeout: 20s
parallaxd_request_ttl: 30s
parallaxd_result_max_age: 2m
parallaxd_stale_multiplier: 3
parallaxd_stale_grace: 30s
parallaxd_watch_interval: 30s
parallaxd_mesh_max_age: 3m

# Checks and components. Empty by default so a first deploy is inert: the fleet
# comes up, the mesh converges, and nothing alerts until you have said what to
# watch.
#
# One list, not two. Each check names the prober that runs it in steady state
# via `prober:`; the coordinator gets the whole list and each prober is
# templated only its own. Everything else happens on request, which is the
# cost model — M probes in steady state, N only during an incident.
#
#   parallaxd_checks:
#     - name: mx-smtps
#       prober: fleeb
#       kind: tcp
#       target: mx.example.com:465
#       vantage: public
#       interval: 1m
#       timeout: 10s
#       quorum: {agree: 2, of: 3, distinct_providers: true}
#
# The coordinator honours `prober:` too, so /v1/assignments and Status() report
# who actually runs each check rather than a hash that disagrees with reality.
# Omit it and the coordinator picks by rendezvous hashing — but then nothing
# templates it onto a prober, so nothing runs it. Set it.
parallaxd_checks:
  # Absorbed from mx_checker, which measured all four from wherever its cron
  # happened to run. The banner match is the point: a wedged Postfix still
  # accepts connections on 25, so a bare TCP check would call it healthy.
  #
  # send: QUIT hangs up politely. Without it every probe logs "lost connection
  # after CONNECT" on the far side, and postscreen scores the abrupt
  # disconnect — a monitor that skipped it could get itself deny-listed by the
  # server it is watching.
  #
  # Spread one per prober so no single vantage carries the whole mail picture.
  - name: mx-smtp
    prober: fleeb
    kind: banner
    target: mx.michaelspost.com:25
    vantage: public
    interval: 1m
    timeout: 15s
    expect_body: Postcow
    send: "QUIT\r\n"
    quorum: {agree: 2, of: 3, distinct_providers: true}

  - name: mxs-smtp
    prober: hetz01
    kind: banner
    target: mxs.michaelspost.com:25
    vantage: public
    interval: 1m
    timeout: 15s
    expect_body: Postfix
    send: "QUIT\r\n"
    quorum: {agree: 2, of: 3, distinct_providers: true}

  - name: mxt-smtp
    prober: glarb
    kind: banner
    target: mxt.michaelspost.com:25
    vantage: public
    interval: 1m
    timeout: 15s
    expect_body: Postfix
    send: "QUIT\r\n"
    quorum: {agree: 2, of: 3, distinct_providers: true}

  - name: mrelay-smtp
    prober: spike
    kind: banner
    target: mrelay.kilo666.com:25
    vantage: public
    interval: 1m
    timeout: 15s
    expect_body: Postfix
    send: "QUIT\r\n"
    quorum: {agree: 2, of: 3, distinct_providers: true}


  # ---------------------------------------------------------------------
  # Absorbed from Uptime Kuma, which measured all of these from a single
  # container on dock01 — so a dock01 blip read as every site being down at
  # once. These are the ten that reach the public internet; the .internal
  # ones wait for internal probers, and the ping monitors wait for an ICMP
  # check kind.
  #
  # Assignment avoids self-checking. Several of these are HOSTED ON a
  # prober (files/social/matter on fleeb, mxo on hetz01), and a prober
  # checking a site it serves proves nothing: if the host dies the check
  # goes stale rather than reporting down, which is a silent gap exactly
  # where a loud one is wanted.
  # ---------------------------------------------------------------------

  - name: kilo666-www
    prober: fleeb
    kind: http
    target: https://kilo666.com/
    vantage: public
    interval: 1m
    timeout: 15s
    quorum: {agree: 2, of: 3, distinct_providers: true}

  # Hosted on fleeb, so fleeb must not be the one asking.
  - name: mattermost
    prober: hetz01
    kind: http
    target: https://matter.kilo666.com
    vantage: public
    interval: 1m
    timeout: 15s
    quorum: {agree: 2, of: 3, distinct_providers: true}

  - name: subtotal-status
    prober: glarb
    kind: http
    target: https://status.subtotal.com
    vantage: public
    interval: 1m
    timeout: 15s
    quorum: {agree: 2, of: 3, distinct_providers: true}

  - name: units-www
    prober: spike
    kind: http
    target: https://units.kilo666.com
    vantage: public
    interval: 1m
    timeout: 15s
    quorum: {agree: 2, of: 3, distinct_providers: true}

  # Kuma stored a keyword for this one ("Up and processing PHP") but ran it as
  # a plain status check on the homepage, where that string does not appear —
  # so it was never enforced and the monitor only ever proved nginx returned
  # 200. Pointed at the health endpoint the other sites use, matching the
  # string it actually returns: entanglenet is static, so it says "static
  # HTML" where the PHP sites say "PHP".
  - name: entanglenet-www
    prober: fleeb
    kind: http
    target: https://entanglenet.com/server-test.php
    vantage: public
    interval: 1m
    timeout: 15s
    expect_body: Up and processing static HTML
    quorum: {agree: 2, of: 3, distinct_providers: true}

  # Hosted on fleeb.
  - name: files-michaelspost
    prober: glarb
    kind: http
    target: https://files.michaelspost.com/test
    vantage: public
    interval: 1m
    timeout: 15s
    expect_body: Hi
    quorum: {agree: 2, of: 3, distinct_providers: true}

  - name: labbookdesigns-www
    prober: hetz01
    kind: http
    target: https://labbookdesigns.com/server-test.php
    vantage: public
    interval: 1m
    timeout: 15s
    expect_body: Up and processing PHP
    quorum: {agree: 2, of: 3, distinct_providers: true}

  - name: michaelspost-www
    prober: spike
    kind: http
    target: https://michaelspost.com/server-test.php
    vantage: public
    interval: 1m
    timeout: 15s
    expect_body: Up and processing PHP
    quorum: {agree: 2, of: 3, distinct_providers: true}

  # Hosted on hetz01.
  - name: mxo-michaelspost
    prober: fleeb
    kind: http
    target: https://mxo.michaelspost.com/
    vantage: public
    interval: 1m
    timeout: 15s
    expect_body: MX Offenders
    quorum: {agree: 2, of: 3, distinct_providers: true}

  # Hosted on fleeb.
  - name: social-mjohnson
    prober: spike
    kind: http
    target: https://social.mjohnson.tech/
    vantage: public
    interval: 1m
    timeout: 15s
    expect_body: The social network of the future
    quorum: {agree: 2, of: 3, distinct_providers: true}


parallaxd_components:
  # The MX records are a pool — 10 mx, 20 mxs, 30 mxt — so one host being
  # down does not stop mail arriving. mx_checker alerted on any of them,
  # which paged for a degradation. down_if: all reports the outage: nobody
  # can deliver.
  #
  # The individual checks still exist and still appear in /v1/status, so
  # "which one" is a question the export answers. What changes is what wakes
  # someone up.
  - name: inbound-mail
    description: Accepting mail for michaelspost.com and kilo666.com
    checks: [mx-smtp, mxs-smtp, mxt-smtp]
    down_if: all

  # mrelay is not an MX. It is the outbound relay, and there is one, so any
  # failure is the failure.
  - name: outbound-relay
    description: Outbound mail relay
    checks: [mrelay-smtp]
    down_if: any

  # Deliberately no components for the web checks. The MX records are a
  # genuine pool — redundant members of one service — which is what a rollup
  # is for. Ten independent sites are not: grouping them by shared host would
  # turn "kilo666.com is down" into "snuffles-sites are down", which is less
  # actionable, not more. A component earns its place when a person would
  # rather hear the group than the member.

parallaxd_maintenance: []

# ---------------------------------------------------------------------------
# Probers
# ---------------------------------------------------------------------------

parallaxd_prober_listen: "0.0.0.0:{{ parallaxd_prober_port }}"
parallaxd_mesh_interval: 30s
parallaxd_mesh_timeout: 5s
parallaxd_assignment_interval: 30s

# Where this prober may connect, independent of what the coordinator asks for.
# The host's owner decides what is reachable; the coordinator only decides what
# is worth checking, and the second must not be able to override the first.
#
# Empty means "anywhere the built-in and vantage rules permit" — reasonable for
# a prober on a public network, wrong for one that can route into a LAN. Set an
# explicit allowlist on any internal prober.
parallaxd_allow_targets: []
parallaxd_deny_targets: []
